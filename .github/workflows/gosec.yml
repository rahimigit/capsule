name: CI gosec
on:
  # automatic triggers removed 2026-10-30 to stop burning hosted-runner minutes; run manually
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v2
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: ./...
